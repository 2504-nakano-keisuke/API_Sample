plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.13'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // 追加
    implementation 'org.springframework.boot:spring-boot-starter-validation' // 追加
    runtimeOnly 'com.mysql:mysql-connector-j'// 追加
    implementation 'jakarta.persistence:jakarta.persistence-api'// 追加
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'// 追加
    compileOnly 'org.projectlombok:lombok'// 追加
    annotationProcessor 'org.projectlombok:lombok' // 追加
}


tasks.named('test') {
	useJUnitPlatform()
}
